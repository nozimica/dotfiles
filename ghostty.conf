# Copy terminfo to remote hosts on SSH so TERM renders correctly (no xterm fallback)
shell-integration-features = ssh-terminfo,ssh-env

# font-family = JetBrainsMono Nerd Font
# font-family = CaskaydiaCove Nerd Font Propo
font-family = FantasqueSansM Nerd Font
#font-family = VictorMono NFM Medium
font-size = 15
theme = nordfox

# Full P3 wide color gamut on Apple displays
window-colorspace = display-p3

# Integrate tabs into the title bar to save vertical space
window-save-state = "never"
macos-titlebar-style = tabs

# Ctrl+c copy only when selected text, SIGINT otherwise
keybind = performable:ctrl+c=copy_to_clipboard
selection-clear-on-copy = true

# Unbind this in macOS to avoid conflicts with Vim
keybind = cmd+w=unbind
#keybind=ctrl+shift+w=close_window

# Color of the split divider line
# If unset, Ghostty picks a default based on your theme
split-divider-color = #6d4aff

# Dim unfocused splits so the active pane stands out
# Defaults to your background color (subtle). Set a darker
# overlay for a stronger effect:
unfocused-split-opacity = 0.7

window-padding-y = 0