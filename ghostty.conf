# Copy terminfo to remote hosts on SSH so TERM renders correctly (no xterm fallback)
shell-integration-features = ssh-terminfo,ssh-env

theme = TokyoNight Night

# Full P3 wide color gamut on Apple displays
window-colorspace = display-p3

# Integrate tabs into the title bar to save vertical space
macos-titlebar-style = tabs

# Swap Ctrl and Cmd
key-remap = ctrl=super
key-remap = super=ctrl

# Ctrl+c copy only when selected text, SIGINT otherwise
keybind = performable:ctrl+c=copy_to_clipboard
selection-clear-on-copy = true

